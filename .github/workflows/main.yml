name: Mac-Tahoe-VNC-HighRes-2026
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-26
    steps:
      - name: Setup User and TCC Permissions
        run: |
          # 1. Create Admin User
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "Password123" -admin

          # 2. Fix TCC (Updated for macOS 26 schema)
          DB_PATH="/Library/Application Support/com.apple.TCC/TCC.db"
          TIMESTAMP=$(date +%s)
          # We grant permissions to both the agent and the ScreenSharing app
          for client in "com.apple.screensharing.agent" "com.apple.ScreenSharing"; do
            sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$client',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"
            sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','$client',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"
          done

      - name: Force 1080p High-Resolution
        run: |
          # 3. Install BetterDisplay CLI for virtual display management
          brew install --cask betterdisplay
          
          # Start BetterDisplay in the background
          open -a "BetterDisplay"
          sleep 10
          
          # 4. Create a 1920x1080 Virtual Dummy
          # This creates a "fake" monitor that VNC can actually see at 1080p
          # Using the 2026 CLI syntax for Tahoe compatibility
          /Applications/BetterDisplay.app/Contents/MacOS/BetterDisplay create -name=VirtualDisplay -width=1920 -height=1080 -activate
          
          # 5. Bootstrap Screen Sharing to recognize the new display
          sudo launchctl enable system/com.apple.screensharing
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true

      - name: Kickstart VNC and Tailscale
        run: |
          # 6. Final ARD Kickstart
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy yes -setvncpw Password123 \
            -restart -agent -privs -all

          # 7. Start Tailscale
          brew install tailscale
          sudo /opt/homebrew/bin/tailscaled --tun=userspace-networking &
          sleep 5
          
          sudo /opt/homebrew/bin/tailscale up --authkey=tskey-auth-kRAAS3BZfX11CNTRL-5263jxJh5c551juEQv81c5ZXq6YxjgaL --hostname=github-mac-tahoe
          
          echo "Your 1080p VNC IP Address is:"
          /opt/homebrew/bin/tailscale ip -4
          
          while true; do echo "Status: 1080p Active at $(date)"; sleep 60; done
