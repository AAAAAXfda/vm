name: Mac-Tahoe-VNC-Final-2026
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-26
    steps:
      - name: Comprehensive VNC & Display Fix
        run: |
          # 1. Create Admin User
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "Password123" -admin

          # 2. Inject TCC Permissions (Updated 2026 Schema)
          # Grants Screen Recording & Accessibility to the agents to prevent "Black Screen"
          DB_PATH="/Library/Application Support/com.apple.TCC/TCC.db"
          TIMESTAMP=$(date +%s)
          SERVICES=("kTCCServiceScreenCapture" "kTCCServiceAccessibility")
          CLIENTS=("com.apple.screensharing.agent" "com.apple.ScreenSharing")

          for service in "${SERVICES[@]}"; do
            for client in "${CLIENTS[@]}"; do
              sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('$service','$client',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"
            done
          done

          # 3. Initialize WindowServer & Remote Management
          # These bypass the 'connection refused' issue by force-starting the daemons
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist ARD_AllLocalUsers -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist CaptureDisplay -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist ShowScreenObservationBanner -bool false
          
          # Force the Screen Sharing service to load manually (critical for Tahoe)
          sudo launchctl enable system/com.apple.screensharing
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true

          # 4. Kickstart ARD/VNC
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy yes -setvncpw Password123 \
            -restart -agent -privs -all

          # 5. Connectivity Check (Wait for port 5900)
          echo "Waiting for VNC Port 5900 to open..."
          for i in {1..15}; do
            if lsof -Pi :5900 -sTCP:LISTEN; then
              echo "SUCCESS: VNC service is listening."
              break
            fi
            sleep 2
          done

      - name: Setup Tailscale
        run: |
          brew install tailscale
          sudo /opt/homebrew/bin/tailscaled --tun=userspace-networking &
          sleep 5
          
          # Using your provided key
          sudo /opt/homebrew/bin/tailscale up --authkey=tskey-auth-kRAAS3BZfX11CNTRL-5263jxJh5c551juEQv81c5ZXq6YxjgaL --hostname=github-mac-tahoe
          
          echo "Connect to this IP via VNC Client:"
          /opt/homebrew/bin/tailscale ip -4
          
          # Maintain session
          while true; do echo "Keep-alive: $(date)"; sleep 60; done
