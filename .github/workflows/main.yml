name: Mac-Sequoia-VNC-2026
on: workflow_dispatch

jobs:
  run-mac:
    # Specifically targeting the Apple Silicon macOS 15 runner
    runs-on: macos-15
    steps:
      - name: Setup Remote Management & Fix TCC
        run: |
          # 1. Create the VNC Admin User
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "Password123" -admin
          
          # 2. Update TCC Database for macOS 15 agent paths
          # Sequoia still uses the kTCCServiceScreenCapture and kTCCServiceAccessibility services
          TIMESTAMP=$(date +%s)
          DB_PATH="/Library/Application Support/com.apple.TCC/TCC.db"
          
          sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"
          sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"

          # 3. Enable Remote Management (Sequoia Kickstart)
          # Note: In macOS 15, kickstart is restricted. We use the -vnclegacy flag for standard VNC clients.
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw Password123 \
            -restart -agent -privs -all

          # 4. Suppress the Sequoia Screen Recording persistent banner
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist ShowScreenObservationBanner -bool false

      - name: Setup Tailscale (Optimized)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # Use a specific hostname for the new OS version
          args: --hostname=github-mac-sequoia-arm64

      - name: Keep Alive & Info
        run: |
          echo "Connect via VNC to: $(tailscale ip -4):5900"
          echo "Username: vncuser"
          echo "Password: Password123"
          # Loop to keep the runner alive (GitHub Actions max timeout is 6 hours)
          while true; do 
            echo "Status: Connected at $(date)"
            sleep 60
          done
