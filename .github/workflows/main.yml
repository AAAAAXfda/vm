name: Mac-Final-Success
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-latest
    steps:
      - name: Setup VNC Password (The Secret Hack)
        run: |
          # 1. Start the Remote Management service
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -restart -agent -privs -all
          
          # 2. Bypass "Screen recording" warnings by manual hashing
          # This injects the password 'Password123' directly into the VNC settings file
          echo "82A5E6928C97E8B3" | sudo tee /Library/Preferences/com.apple.VNCSettings.txt
          
          # 3. Force user password so you can log into the lock screen
          echo "Password123" | sudo passwd -u runner
          sudo sysadminctl -adminUser runner -adminPassword "" -password "Password123" -resetPasswordFor runner

      - name: Install & Run Tailscale
        run: |
          # 4. Install via Brew (the most reliable way for GitHub)
          brew install tailscale
          
          # 5. Start the Tailscale background process
          sudo /usr/local/bin/tailscaled --tun=userspace-networking &
          sleep 5
          
          # 6. Use your provided key to connect
          sudo /usr/local/bin/tailscale up --authkey=tskey-auth-kRAAS3BZfX11CNTRL-5263jxJh5c551juEQv81c5ZXq6YxjgaL --hostname=github-mac
          
          echo "Connected! Look for 'github-mac' in your Tailscale dashboard."
          sleep 21600
