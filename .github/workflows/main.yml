name: Mac-Remote-Connect
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-latest
    steps:
      - name: Start VNC Server
        run: |
          # Start the Mac desktop sharing service
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -restart -agent -privs -all
          # Set the password to 'Password123'
          sudo dscl . -passwd /Users/runner Password123

      - name: Connect Tunnel
        run: |
          brew install cloudflared
          # Replace the text below with your actual token
          cloudflared tunnel --no-autoupdate run --token eyJhIjoiMDI0YjU1ODEzNTlhYWJjYzM0YWIwYmVkOTBjODJjNDkiLCJ0IjoiMDVjZDNhZDEtMTAwZC00Y2MyLWE4MjctZTczMjI0MTA5NTY1IiwicyI6Ik1UZzFaVGt6TW1VdE1Ea3dNeTAwT1RReUxUZ3pZVEl0WVRkak5EVmhNbUZpWXpRMSJ9 &
          sleep 21600
