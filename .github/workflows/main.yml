name: Mac-Sonoma-Screen-Fix
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-14
    steps:
      - name: Force Permissions & Remote Management
        run: |
          # 1. Create the admin user
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "Password123" -admin
          
          # 2. Grant full control privileges (Bypasses 'View Only' mode)
          # The -menu flag is crucial here; it initializes the UI components
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw Password123 \
            -users vncuser -privs -all \
            -restart -agent -menu

          # 3. Simulate MDM check to 'bless' the screen recording service
          # This often triggers the background permission without a popup
          sudo /usr/libexec/mdmclient QuerySecurityQueries
          
          # 4. Final 'Control' Override
          # This tells macOS that VNC connections are allowed to interact, not just watch
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCPassword -data $(echo "Password123" | perl -we 'print pack "H*", "82A5E6928C97E8B3"')

      - name: Start Tailscale
        run: |
          brew install tailscale
          sudo /opt/homebrew/bin/tailscaled --tun=userspace-networking &
          sleep 10
          sudo /opt/homebrew/bin/tailscale up --authkey=tskey-auth-kRAAS3BZfX11CNTRL-5263jxJh5c551juEQv81c5ZXq6YxjgaL --hostname=github-mac-fix
          
          while true; do echo "Screen session active: $(date)"; sleep 60; done
