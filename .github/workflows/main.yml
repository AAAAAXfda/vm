name: Mac-Ultimate-Fix
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-latest
    steps:
      - name: Force Password & VNC (Sequoia Fix)
        run: |
          # 1. Enable Screen Sharing
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -restart -agent -privs -all
          
          # 2. THE FIX: Create a NEW admin user. 
          # Since we can't change the 'runner' password easily, we create 'admin2'
          sudo sysadminctl -adminUser runner -adminPassword "" -addUser admin2 -fullName "Admin Two" -password "Password123" -admin
          
          # 3. Set a VNC-specific password (Legacy mode)
          # RealVNC loves this. It bypasses the standard Mac login window lock.
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvncpasswd -vncpasswd Password123

      - name: Setup Tailscale
        run: |
          brew install tailscale
          # Start the background service
          sudo /opt/homebrew/bin/tailscaled --tun=userspace-networking &
          sleep 5
          
          # Use your key
          sudo /opt/homebrew/bin/tailscale up --authkey=tskey-auth-kRAAS3BZfX11CNTRL-5263jxJh5c551juEQv81c5ZXq6YxjgaL --hostname=github-mac
          
          # 4. Stay Alive Loop
          while true; do echo "Keep-alive: $(date)"; sleep 60; done
