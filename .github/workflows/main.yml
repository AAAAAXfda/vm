name: Tahoe-AnyDesk
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-latest
    steps:
      - name: Kill UI Bloat
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool true
          defaults write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false
          defaults write com.apple.finder DisableAllAnimations -bool true

      - name: Download & Install AnyDesk PKG
        run: |
          curl -fsSL -o AnyDesk.pkg https://download.anydesk.com/macos/AnyDesk.pkg
          sudo installer -pkg AnyDesk.pkg -target /

      - name: Patch TCC Permissions for AnyDesk
        run: |
          TIMESTAMP=$(date +%s)
          DB_PATH="/Library/Application Support/com.apple.TCC/TCC.db"
          
          # Inject Screen Capture and Accessibility rights directly into TCC
          sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.philandro.anydesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"
          sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.philandro.anydesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"

      - name: Configure AnyDesk & Set Password
        run: |
          # Strip quarantine
          sudo xattr -cr /Applications/AnyDesk.app || true

          # Launch AnyDesk to initialize the service
          open -g /Applications/AnyDesk.app
          sleep 5

          # Set unattended access password (at least 8 chars)
          echo "SecretPass123!" | sudo /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --set-password

      - name: Get AnyDesk ID
        run: |
          sleep 2
          ANYDESK_ID=$(/Applications/AnyDesk.app/Contents/MacOS/AnyDesk --get-id)
          
          echo "=========================================================="
          echo "ANYDESK ID: $ANYDESK_ID"
          echo "PASSWORD:   SecretPass123!"
          echo "=========================================================="

      - name: Keep Runner Alive
        run: |
          while true; do echo "Keep-alive: $(date)"; sleep 60; done
