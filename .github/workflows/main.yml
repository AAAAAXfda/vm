name: Mac-Sonoma-VNC-2026
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-14  # Sonoma
    steps:
      - name: Setup Remote Management & Bypass TCC
        run: |
          # 1. Create a fresh admin user
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "Password123" -admin
          
          # 2. Grant permissions to ARDAgent and ScreenSharing
          # We insert these into the TCC database to bypass the "Allow" popups
          # Note: If SIP is active, this may warn, but it's the best programmatic fix available.
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));"
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));"

          # 3. Enable Remote Management (Legacy mode)
          # We run this twice; sometimes the first kickstart fails to register the password in Sonoma.
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw Password123 \
            -restart -agent -privs -all
          
          # 4. Disable the annoying Sonoma "Screen Observation" menu bar icon
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist ShowScreenObservationBanner -bool false

      - name: Install & Run Tailscale
        run: |
          brew install tailscale
          # Start tailscaled in userspace mode
          sudo /opt/homebrew/bin/tailscaled --tun=userspace-networking &
          sleep 5
          
          # Connect to Tailscale (using your provided public key)
          sudo /opt/homebrew/bin/tailscale up --authkey=tskey-auth-kRAAS3BZfX11CNTRL-5263jxJh5c551juEQv81c5ZXq6YxjgaL --hostname=github-mac-sonoma
          
          # Display the IP for the user
          echo "Your VNC IP is:"
          /opt/homebrew/bin/tailscale ip -4
          
          # Keep the runner alive
          while true; do echo "Status: Connected at $(date)"; sleep 60; done
