- name: Fix TCC and Enable Remote Management
        run: |
          # 1. Create the user
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "Password123" -admin
          
          # 2. Inject Screen Recording & Accessibility permissions (17-column schema)
          # Format: service, client, client_type, auth_value, auth_reason, auth_version, flags, 
          # last_modified, policy_id, indirect_object_identifier_type, indirect_object_identifier, 
          # indirect_object_code_identity, last_usage_timestamp, prompt_count, preflight_unknown, 
          # attribution_log_id, singleton_context_id
          
          TIMESTAMP=$(date +%s)
          DB_PATH="/Library/Application Support/com.apple.TCC/TCC.db"
          
          # Grant Screen Recording to the Screen Sharing Agent
          sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"
          
          # Grant Accessibility to the Screen Sharing Agent (required for mouse/keyboard control)
          sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"

          # 3. Enable Screen Sharing service
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw Password123 \
            -restart -agent -privs -all
          
          # 4. Silence the Sonoma "Screen is being observed" alert
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist ShowScreenObservationBanner -bool false
