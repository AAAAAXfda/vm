name: macOS RustDesk
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-latest
    steps:
      - name: Tweak macOS Graphics & Res
        run: |
          # Drop resolution to 720p or 1080p so the encoder doesn't choke on a 4K virtual buffer
          brew install displayplacer
          displayplacer "id:$(displayplacer list | grep -m1 'Persistent screen id' | cut -d: -f2 | xargs) res:1280x720 color_depth:8" || true
          
          # Kill animation overhead
          defaults write com.apple.universalaccess reduceTransparency -bool true
          defaults write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false

      - name: Install RustDesk & Patch TCC
        run: |
          brew install --cask rustdesk
          
          TIMESTAMP=$(date +%s)
          DB_PATH="/Library/Application Support/com.apple.TCC/TCC.db"
          
          # Grant RustDesk Screen Capture and Accessibility rights directly in TCC
          sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.carriez.RustDesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"
          sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.carriez.RustDesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"

      - name: Start RustDesk Service
        run: |
          # Set a static permanent password
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password "Password123!"
          
          # Launch service in background
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --service &
          sleep 3
          
          # Grab the 9-digit RustDesk ID
          echo "=========================================="
          echo "YOUR RUSTDESK ID IS:"
          /Applications/RustDesk.app/Contents/MacOS/RustDesk --get-id
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do echo "Running at $(date)"; sleep 60; done
