name: cereal-box
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-15
    steps:
      - name: Enable & Tune Low-Latency OpenSSH
        run: |
          # 1. Turn on Apple's OpenSSH server
          sudo systemsetup -setremotelogin on

          ACTIVE_USER=$(stat -f "%Su" /dev/console)
          USER_HOME=$(eval echo "~$ACTIVE_USER")
          
          # 2. Setup .ssh directory safely
          sudo chmod 755 "$USER_HOME"
          mkdir -p "$USER_HOME/.ssh"
          
          # 3. Pull key from secrets (falls back to your public GitHub keys if secret is missing)
          if [ -n "${{ secrets.SSH_PUBLIC_KEY }}" ]; then
            echo "${{ secrets.SSH_PUBLIC_KEY }}" > "$USER_HOME/.ssh/authorized_keys"
          else
            curl -fsSL "https://github.com/${{ github.actor }}.keys" > "$USER_HOME/.ssh/authorized_keys"
          fi
          
          chmod 700 "$USER_HOME/.ssh"
          chmod 600 "$USER_HOME/.ssh/authorized_keys"
          chown -R "$ACTIVE_USER" "$USER_HOME/.ssh"

          # 4. Tune sshd for instant low-latency key-only auth
          sudo tee -a /etc/ssh/sshd_config << 'EOF'
          StrictModes no
          UseDNS no
          GSSAPIAuthentication no
          IPQoS lowdelay throughput
          Compression no
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          TCPKeepAlive yes
          EOF

          # Restart OpenSSH daemon
          sudo killall -HUP sshd || true

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Connection Details
        run: |
          ACTIVE_USER=$(stat -f "%Su" /dev/console)
          TS_IP=$(tailscale ip -4)
          echo "=========================================================="
          echo "RUN THIS EXACT COMMAND IN WINDOWS CMD OR POWERSHELL:"
          echo "ssh -o IPQoS=lowdelay -i \"%USERPROFILE%\\.ssh\\id_ed25519\" $ACTIVE_USER@$TS_IP"
          echo "=========================================================="

      - name: Keep Runner Alive
        run: |
          while true; do echo "Keep-alive: $(date)"; sleep 60; done
