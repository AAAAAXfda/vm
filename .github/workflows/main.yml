name: Mac-Sequoia-Fix-V5
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-latest
    steps:
      - name: Setup Remote Management
        run: |
          # 1. Create a fresh admin (This worked in your logs)
          sudo sysadminctl -adminUser runner -adminPassword "" -addUser vncuser -fullName "VNC User" -password "Password123" -admin
          
          # 2. Enable Remote Management for ALL users with full privileges
          # This is the modern, supported way to bypass the "Screen Recording" prompt
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -allowAccessFor -allUsers -privs -all
          
          # 3. Enable the "VNC Legacy" mode so RealVNC can connect
          # We use defaults write instead of kickstart flags that were removed
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist VNCPassword -data $(echo "Password123" | perl -we 'print pack "H*", "82A5E6928C97E8B3"')
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist VNCAlwaysStartOnConsole -bool true
          
          # 4. Restart the agent to apply settings
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

      - name: Start Tailscale
        run: |
          brew install tailscale
          sudo /opt/homebrew/bin/tailscaled --tun=userspace-networking &
          sleep 5
          sudo /opt/homebrew/bin/tailscale up --authkey=YOUR_KEY_HERE --hostname=github-mac
          
          while true; do echo "Keep-alive: $(date)"; sleep 60; done
