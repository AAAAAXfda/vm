name: Tahoe-Fixed
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-latest
    steps:
      - name: Kill UI Bloat
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool true
          defaults write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false
          defaults write com.apple.finder DisableAllAnimations -bool true

      - name: Install RustDesk & Patch TCC
        run: |
          brew install --cask rustdesk
          
          TIMESTAMP=$(date +%s)
          DB_PATH="/Library/Application Support/com.apple.TCC/TCC.db"
          
          # Force TCC permissions
          sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.carriez.RustDesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"
          sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.carriez.RustDesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"

      - name: Configure RustDesk & Launch
        run: |
          # Pre-create config directories so the socket and config load properly
          mkdir -p "$HOME/Library/Application Support/RustDesk/config"
          sudo mkdir -p "/Library/Application Support/RustDesk/config"
          
          # Write password and direct IP config directly into the TOML file
          cat << 'EOF' > "$HOME/Library/Application Support/RustDesk/config/RustDesk2.toml"
          password = "SecretPass123!"
          direct_server = "Y"
          EOF
          
          sudo cp "$HOME/Library/Application Support/RustDesk/config/RustDesk2.toml" "/Library/Application Support/RustDesk/config/RustDesk2.toml"
          
          # Launch RustDesk inside the GUI session
          open -a "/Applications/RustDesk.app"
          sleep 5
          
          # Now that the socket exists, verify it's responsive
          /Applications/RustDesk.app/Contents/MacOS/RustDesk --get-id || true

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Connection Details
        run: |
          echo "=========================================================="
          echo "TAILSCALE IP:"
          tailscale ip -4
          echo "RUSTDESK PASSWORD: SecretPass123!"
          echo "=========================================================="

      - name: Keep Runner Alive
        run: |
          while true; do echo "Keep-alive: $(date)"; sleep 60; done
