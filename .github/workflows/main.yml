name: Mac-Tahoe-VNC-FIXED-V2
on: workflow_dispatch

jobs:
  run-mac:
    runs-on: macos-26
    steps:
      - name: Setup Remote Management (FDA Bypass)
        run: |
          # 1. Create User (ignore the ScalerParavirt error, it's a known non-fatal VM log)
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "Password123" -admin
          
          # 2. Fix TCC Permissions
          DB_PATH="/Library/Application Support/com.apple.TCC/TCC.db"
          TIMESTAMP=$(date +%s)
          # Use a loop to ensure all necessary services are injected
          for service in kTCCServiceScreenCapture kTCCServiceAccessibility; do
            sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('$service','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"
            sudo sqlite3 "$DB_PATH" "INSERT OR REPLACE INTO access VALUES('$service','com.apple.ScreenSharing',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${TIMESTAMP},0,0,NULL,NULL);"
          done

          # 3. Bypass 'systemsetup' FDA requirement
          # Instead of systemsetup -setremoteappleevents on, we write to the global preferences
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist ARD_AllLocalUsers -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist CaptureDisplay -bool true
          
          # 4. Kickstart ARD/VNC
          # The kickstart tool is the most reliable way to bypass 'Black Screen' on Tahoe
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy yes -setvncpw Password123 \
            -restart -agent -privs -all

          # 5. Suppress Observation Banner
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist ShowScreenObservationBanner -bool false

      - name: Install & Run Tailscale
        run: |
          brew install tailscale
          sudo /opt/homebrew/bin/tailscaled --tun=userspace-networking &
          sleep 5
          
          # Using your provided key
          sudo /opt/homebrew/bin/tailscale up --authkey=tskey-auth-kRAAS3BZfX11CNTRL-5263jxJh5c551juEQv81c5ZXq6YxjgaL --hostname=github-mac-tahoe
          
          echo "VNC IP Address:"
          /opt/homebrew/bin/tailscale ip -4
          
          while true; do echo "Status: Active at $(date)"; sleep 60; done
